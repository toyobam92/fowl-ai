name: review-email

# Sends a copy of the in-progress issue draft to the owner's own inbox for
# review -- never to the subscriber list. Triggered by the weekly-issue skill
# right after opening/updating a draft PR. Needs GMAIL_ADDRESS/GMAIL_APP_PASSWORD
# as repo secrets (app password from Google Account > Security > App passwords).

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch the draft lives on, e.g. draft/issue-11 (defaults to main)'
        required: false
        default: 'main'
      issue_path:
        description: 'Path to the issue HTML to send, e.g. issues/2026-08-03/index.html'
        required: true
      subject:
        description: 'Email subject line (will be prefixed with "[Review] ")'
        required: true
      note:
        description: 'Short note shown at the top of the email'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      # Drafts live on draft/issue-<N> until merged -- must check out that
      # branch explicitly, since a bare checkout defaults to main, where the
      # file doesn't exist yet. (This broke the first real run, 2026-08-02.)
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Send review email
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          # Passed via env, not spliced into the script -- ${{ }} substitutes
          # literal text before bash/python ever see it, so arbitrary subject/
          # note text (quotes, $, backticks) can break out of the quoting.
          ISSUE_PATH: ${{ github.event.inputs.issue_path }}
          SUBJECT: ${{ github.event.inputs.subject }}
          NOTE: ${{ github.event.inputs.note }}
        run: python3 automation/send_review_email.py

      - name: Notify Telegram
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SUBJECT: ${{ github.event.inputs.subject }}
        run: |
          set -euo pipefail
          MSG=$(printf '\xF0\x9F\x93\xA7 Review copy sent to your inbox: %s\n\nReply here with any changes, or "APPROVE <PR#>" when it looks good.' "$SUBJECT")
          curl -s "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MSG}" > /dev/null
