name: check-meta-tokens

# On-demand health check for the Meta Graph API credentials post_to_meta.py
# posts with (Facebook page, Threads, Instagram). Read-only -- one GET /me
# per credential, nothing is ever published -- so it's safe to run any time
# the question is "are the posting tokens still good?" without waiting for
# an evening publish run to fail. The long-lived Threads/Instagram tokens
# expire (~60 days), and this is the cheap way to catch that early.

on:
  workflow_dispatch: {}
  # Also fires on pushes to the branch that introduced this check, so the
  # check can run before the workflow lands on main (workflow_dispatch is
  # only routable for workflows GitHub has indexed from the default branch).
  # Harmless to keep: the branch is deleted on merge.
  push:
    branches:
      - claude/ghop-token-check-uip0sb

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify each Graph API credential
        env:
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_THREADS_ACCESS_TOKEN: ${{ secrets.META_THREADS_ACCESS_TOKEN }}
          META_THREADS_USER_ID: ${{ secrets.META_THREADS_USER_ID }}
          META_IG_ACCESS_TOKEN: ${{ secrets.META_IG_ACCESS_TOKEN }}
          META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
        run: python3 automation/check_meta_tokens.py

      - name: Verify stored GitHub PAT (Telegram worker's token)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_PAT: ${{ secrets.GITHUB_PAT }}
          PAT: ${{ secrets.PAT }}
          PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          WORKER_GH_TOKEN: ${{ secrets.WORKER_GH_TOKEN }}
          TELEGRAM_GH_TOKEN: ${{ secrets.TELEGRAM_GH_TOKEN }}
        run: python3 automation/check_github_token.py
