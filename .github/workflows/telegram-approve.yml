name: telegram-approve

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Poll Telegram for APPROVE/SCHEDULE replies
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 - <<'PYEOF'
          import datetime, json, os, re, subprocess, time, urllib.parse, urllib.request

          bot = os.environ["TELEGRAM_BOT_TOKEN"]
          chat_id = os.environ["TELEGRAM_CHAT_ID"]
          api = f"https://api.telegram.org/bot{bot}"

          # Fetch the full unacknowledged backlog (offset=0), then immediately
          # re-request past the highest update_id seen to ack/clear it with
          # Telegram, regardless of whether we act on it. This makes the poll
          # stateless across workflow runs -- no repo/cache persistence needed.
          with urllib.request.urlopen(f"{api}/getUpdates?offset=0&timeout=0") as r:
              data = json.load(r)

          updates = data.get("result", [])
          max_id = max((u["update_id"] for u in updates), default=0)

          if max_id:
              ack_url = f"{api}/getUpdates?offset={max_id + 1}&timeout=0"
              urllib.request.urlopen(ack_url).read()

          now = time.time()
          FRESH_WINDOW_SECONDS = 20 * 60  # tolerate poll delay/backoff

          def notify(text):
              body = urllib.parse.urlencode({"chat_id": chat_id, "text": text}).encode()
              urllib.request.urlopen(f"{api}/sendMessage", data=body).read()

          def pr_meta(pr):
              view = subprocess.run(
                  ["gh", "pr", "view", pr, "--json", "headRefName,title,files,state,mergedAt"],
                  capture_output=True, text=True,
              )
              return json.loads(view.stdout) if view.returncode == 0 else {}

          def next_monday_iso():
              today = datetime.date.today()
              days_ahead = (7 - today.weekday()) % 7  # Monday == 0; today counts if it IS Monday
              return (today + datetime.timedelta(days=days_ahead)).isoformat()

          for u in updates:
              msg = u.get("message") or {}
              if str(msg.get("chat", {}).get("id")) != str(chat_id):
                  continue
              if now - msg.get("date", 0) > FRESH_WINDOW_SECONDS:
                  continue  # stale, likely already handled in a prior run
              text = (msg.get("text") or "").strip()

              approve = re.match(r"^APPROVE\s+(\d+)$", text, re.IGNORECASE)
              schedule = re.match(r"^SCHEDULE\s+(\d+)$", text, re.IGNORECASE)

              if approve:
                  pr = approve.group(1)
                  # Merging only ever deploys the site. It never touches email --
                  # that requires a separate, explicit SCHEDULE <PR#> reply.
                  result = subprocess.run(
                      ["gh", "pr", "merge", pr, "--squash", "--delete-branch"],
                      capture_output=True, text=True,
                  )
                  if result.returncode != 0:
                      err = (result.stderr or result.stdout).strip()[:300]
                      notify(f"❌ Could not merge PR #{pr}: {err}")
                      continue
                  meta = pr_meta(pr)
                  is_issue = meta.get("headRefName", "").startswith("draft/issue-")
                  extra = " Reply \"SCHEDULE %s\" when you want to also schedule the email." % pr if is_issue else ""
                  notify(f"✅ Merged PR #{pr} — deploying to fowl-ai.com now.{extra}")
                  continue

              if schedule:
                  pr = schedule.group(1)
                  meta = pr_meta(pr)
                  if not meta:
                      notify(f"❌ Couldn't look up PR #{pr}.")
                      continue
                  if not meta.get("mergedAt"):
                      notify(f"⚠️ PR #{pr} isn't merged yet — reply \"APPROVE {pr}\" first, then \"SCHEDULE {pr}\".")
                      continue
                  issue_paths = [
                      f["path"] for f in meta.get("files", [])
                      if re.match(r"^issues/[\d-]+/index\.html$", f.get("path", ""))
                  ]
                  if not issue_paths:
                      notify(f"⚠️ PR #{pr} has no issues/<date>/index.html — nothing to schedule.")
                      continue
                  target_date = next_monday_iso()
                  dispatch = subprocess.run(
                      ["gh", "workflow", "run", "send-issue.yml",
                       "-f", f"issue_path={issue_paths[0]}",
                       "-f", f"subject={meta.get('title', '')}",
                       "-f", f"schedule_date={target_date}",
                       "-f", "schedule_time=7:45 AM"],
                      capture_output=True, text=True,
                  )
                  if dispatch.returncode != 0:
                      notify(f"❌ Couldn't start send-issue.yml for PR #{pr}: {dispatch.stderr.strip()[:300]}")
                  else:
                      notify(f"⏳ Building the EmailOctopus schedule for {target_date} 7:45 AM ET — will confirm here once it's armed (or if it fails).")
          PYEOF
