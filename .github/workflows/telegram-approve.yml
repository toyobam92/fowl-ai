name: telegram-approve

# Triggered in real time by a Cloudflare Worker acting as the Telegram webhook
# receiver (see automation/telegram-webhook-worker.js) -- it dispatches this
# workflow with the message's text/chat_id as inputs the moment a message
# arrives. Telegram webhooks and getUpdates polling are mutually exclusive
# for a given bot, so this workflow never calls getUpdates itself; there is
# no separate poller anywhere, so there is nothing left to race.
#
# Still supports a plain manual `gh workflow run telegram-approve.yml` with
# no inputs as a no-op-safe fallback -- useful for testing the merge/schedule
# logic directly without going through Telegram at all.

on:
  workflow_dispatch:
    inputs:
      message_text:
        description: 'Raw Telegram message text'
        required: false
        default: ''
      chat_id:
        description: 'Telegram chat id the message came from'
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  handle:
    if: github.event.inputs.message_text != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Handle one Telegram message
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MESSAGE_TEXT: ${{ github.event.inputs.message_text }}
          MESSAGE_CHAT_ID: ${{ github.event.inputs.chat_id }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_THREADS_ACCESS_TOKEN: ${{ secrets.META_THREADS_ACCESS_TOKEN }}
          META_THREADS_USER_ID: ${{ secrets.META_THREADS_USER_ID }}
          META_IG_ACCESS_TOKEN: ${{ secrets.META_IG_ACCESS_TOKEN }}
          META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
          HEYGEN_API_KEY: ${{ secrets.HEYGEN_API_KEY }}
        run: |
          set -euo pipefail
          python3 - <<'PYEOF'
          import datetime, json, os, re, subprocess, urllib.parse, urllib.request

          bot = os.environ["TELEGRAM_BOT_TOKEN"]
          chat_id = os.environ["TELEGRAM_CHAT_ID"]
          api = f"https://api.telegram.org/bot{bot}"

          def notify(text):
              body = urllib.parse.urlencode({"chat_id": chat_id, "text": text}).encode()
              urllib.request.urlopen(f"{api}/sendMessage", data=body).read()

          def pr_meta(pr):
              view = subprocess.run(
                  ["gh", "pr", "view", pr, "--json", "headRefName,title,files,state,mergedAt"],
                  capture_output=True, text=True,
              )
              return json.loads(view.stdout) if view.returncode == 0 else {}

          def next_monday_iso():
              today = datetime.date.today()
              days_ahead = (7 - today.weekday()) % 7  # Monday == 0; today counts if it IS Monday
              return (today + datetime.timedelta(days=days_ahead)).isoformat()

          # Defense in depth: the Cloudflare Worker already filters by chat_id
          # before ever dispatching this workflow, but check again here in case
          # that filter is ever loosened or bypassed.
          incoming_chat_id = os.environ.get("MESSAGE_CHAT_ID", "")
          if incoming_chat_id and incoming_chat_id != chat_id:
              raise SystemExit(f"chat_id mismatch ({incoming_chat_id} != stored chat_id) -- refusing to act.")

          text = os.environ["MESSAGE_TEXT"].strip()

          approve = re.match(r"^APPROVE\s+(\d+)$", text, re.IGNORECASE)
          schedule = re.match(r"^SCHEDULE\s+(\d+)$", text, re.IGNORECASE)
          publish = re.match(r"^PUBLISH\s+(\d+)$", text, re.IGNORECASE)

          if approve:
              pr = approve.group(1)
              # Merging only ever deploys the site. It never touches email --
              # that requires a separate, explicit SCHEDULE <PR#> reply.
              result = subprocess.run(
                  ["gh", "pr", "merge", pr, "--squash", "--delete-branch"],
                  capture_output=True, text=True,
              )
              if result.returncode != 0:
                  err = (result.stderr or result.stdout).strip()[:300]
                  notify(f"❌ Could not merge PR #{pr}: {err}")
                  raise SystemExit(0)
              meta = pr_meta(pr)
              head_ref = meta.get("headRefName", "")
              is_issue = head_ref.startswith("draft/issue-")
              is_social = head_ref.startswith("update/social-")
              is_nova = head_ref.startswith("update/nova-")
              is_engage = head_ref.startswith("update/engage-")

              if is_nova:
                  # Unlike SCHEDULE/PUBLISH, this fires immediately on
                  # approve, not on a later explicit reply -- the
                  # day-before approval IS the human gate for this
                  # pipeline; publishing itself happens automatically the
                  # next day via auto-publish-nova.yml once the video's
                  # actually rendered. See .claude/skills/nova-daily-prep.
                  subprocess.run(["git", "pull", "--rebase", "origin", "main"], check=True)
                  result = subprocess.run(
                      ["python3", "automation/render_nova_video.py"],
                      capture_output=True, text=True,
                  )
                  print(result.stdout)
                  print(result.stderr)
                  if result.returncode != 0:
                      err = (result.stderr or result.stdout).strip()[:300]
                      notify(f"✅ Merged PR #{pr}. ❌ But the HeyGen render failed to start: {err}")
                      raise SystemExit(0)
                  subprocess.run(["git", "config", "user.email", "actions@github.com"], check=True)
                  subprocess.run(["git", "config", "user.name", "github-actions"], check=True)
                  subprocess.run(["git", "add", "automation/nova-pipeline-state.json"], check=True)
                  staged = subprocess.run(["git", "diff", "--cached", "--quiet"])
                  if staged.returncode != 0:
                      subprocess.run(["git", "commit", "-m", f"Nova render submitted for PR #{pr}"], check=True)
                      subprocess.run(["git", "pull", "--rebase", "origin", "main"], check=True)
                      subprocess.run(["git", "push"], check=True)
                  notify(
                      f"✅ Merged PR #{pr} — Nova's video is rendering now. "
                      f"It'll auto-publish to Facebook + Threads + Instagram on its "
                      f"scheduled day once it's done (checked every 15 min); you'll "
                      f"still need to post it to TikTok manually (no headless path "
                      f"exists for it)."
                  )
                  raise SystemExit(0)

              if is_engage:
                  # Same merge-is-the-gate pattern as is_nova: the APPROVE that
                  # merged the batch is the authorization to post it. Threads
                  # replies go out via API; everything else comes back as a
                  # manual checklist in the notification. See
                  # .claude/skills/engagement-comments.
                  subprocess.run(["git", "pull", "--rebase", "origin", "main"], check=True)
                  result = subprocess.run(
                      ["python3", "automation/post_engagement_comments.py"],
                      capture_output=True, text=True,
                  )
                  print(result.stdout)
                  print(result.stderr)
                  if result.returncode != 0:
                      err = (result.stderr or result.stdout).strip()[:300]
                      notify(f"✅ Merged PR #{pr}. ❌ But posting the comments failed: {err}")
                      raise SystemExit(0)
                  subprocess.run(["git", "config", "user.email", "actions@github.com"], check=True)
                  subprocess.run(["git", "config", "user.name", "github-actions"], check=True)
                  subprocess.run(["git", "add", "automation/engagement-state.json"], check=True)
                  staged = subprocess.run(["git", "diff", "--cached", "--quiet"])
                  if staged.returncode != 0:
                      subprocess.run(["git", "commit", "-m", f"Engagement comments posted for PR #{pr}"], check=True)
                      subprocess.run(["git", "pull", "--rebase", "origin", "main"], check=True)
                      subprocess.run(["git", "push"], check=True)
                  notify(f"✅ Merged PR #{pr}.\n{result.stdout.strip()[:3300]}")
                  raise SystemExit(0)

              if is_issue:
                  extra = " Reply \"SCHEDULE %s\" when you want to also schedule the email." % pr
              elif is_social:
                  extra = " Reply \"PUBLISH %s\" when you want to also post to Facebook." % pr
              else:
                  extra = ""
              notify(f"✅ Merged PR #{pr} — deploying to fowl-ai.com now.{extra}")
              raise SystemExit(0)

          if schedule:
              pr = schedule.group(1)
              meta = pr_meta(pr)
              if not meta:
                  notify(f"❌ Couldn't look up PR #{pr}.")
                  raise SystemExit(0)
              if not meta.get("mergedAt"):
                  notify(f"⚠️ PR #{pr} isn't merged yet — reply \"APPROVE {pr}\" first, then \"SCHEDULE {pr}\".")
                  raise SystemExit(0)
              # send-issue.yml (headless Playwright) can never get past
              # EmailOctopus's Cloudflare bot-check from a GitHub Actions IP --
              # confirmed live, 2026-08-02, screenshot showed the "Verify you
              # are human" challenge. Scheduling can only happen through a real
              # browser/IP, i.e. interactively via Claude Code + claude-in-chrome.
              # Don't dispatch a run that's guaranteed to fail; just point at it.
              target_date = next_monday_iso()
              notify(
                  f"📌 PR #{pr} is merged. EmailOctopus can't be scheduled from "
                  f"here (their bot-protection blocks headless automation) -- "
                  f"open Claude Code and ask to schedule it for {target_date} "
                  f"7:45 AM ET; it'll drive your browser directly, same as "
                  f"Issue 11."
              )
              raise SystemExit(0)

          if publish:
              pr = publish.group(1)
              meta = pr_meta(pr)
              if not meta:
                  notify(f"❌ Couldn't look up PR #{pr}.")
                  raise SystemExit(0)
              if not meta.get("mergedAt"):
                  notify(f"⚠️ PR #{pr} isn't merged yet — reply \"APPROVE {pr}\" first, then \"PUBLISH {pr}\".")
                  raise SystemExit(0)
              # Unlike TikTok, Facebook/Threads/Instagram are all real
              # token-authenticated APIs with no browser-login bot-check to
              # dodge, so all three can post headlessly, right here, no
              # interactive session needed (Instagram via the newer
              # Instagram-Login API product, graph.instagram.com -- a
              # separate credential from the classic Facebook-Login
              # Instagram Graph API path, which remains genuinely blocked
              # on App Review; see project memory).
              result = subprocess.run(
                  ["python3", "automation/post_to_meta.py"],
                  capture_output=True, text=True,
              )
              print(result.stdout)
              print(result.stderr)
              if result.returncode != 0:
                  err = (result.stderr or result.stdout).strip()[:300]
                  notify(f"❌ post_to_meta.py failed for PR #{pr}: {err}")
                  raise SystemExit(0)
              # post_to_meta.py only edits the file on disk -- commit
              # whatever platforms_published flags it updated, same as the
              # inbox relay below does for its own file.
              subprocess.run(["git", "config", "user.email", "actions@github.com"], check=True)
              subprocess.run(["git", "config", "user.name", "github-actions"], check=True)
              subprocess.run(["git", "add", "automation/social-state.json"], check=True)
              staged = subprocess.run(["git", "diff", "--cached", "--quiet"])
              if staged.returncode != 0:
                  subprocess.run(["git", "commit", "-m", f"Mark Meta posts published for PR #{pr}"], check=True)
                  subprocess.run(["git", "pull", "--rebase", "origin", "main"], check=True)
                  subprocess.run(["git", "push"], check=True)
              notify(f"✅ Posted to Facebook + Threads + Instagram for PR #{pr} (check the Action log for detail).")

              # TikTok can't be posted headlessly here -- same
              # Cloudflare/bot-detection risk that ruled out headless
              # EmailOctopus scheduling. List what's still pending so the
              # owner knows exactly what to post manually.
              #
              # Silenced 2026-08-15: Toyo paused TikTok posting for now.
              # Flip TIKTOK_REMINDER_ENABLED back to True to re-enable
              # once TikTok resumes.
              TIKTOK_REMINDER_ENABLED = False
              with open("automation/social-state.json") as f:
                  state = json.load(f)
              pending_manual = [
                  p for p in state.get("posts", [])
                  if not p.get("platforms_published", {}).get("tiktok")
              ]
              if TIKTOK_REMINDER_ENABLED and pending_manual:
                  checklist = "\n".join(f"- {p['day']}: {p['caption']}" for p in pending_manual)
                  notify(
                      "📱 TikTok still needs posting manually -- it can't be done headless. "
                      f"Open an interactive Claude Code session to post these via browser:\n{checklist}"
                  )
              raise SystemExit(0)

          # Not APPROVE, SCHEDULE, or PUBLISH -- relay verbatim for the
          # weekly-issue routine to interpret (topic pick, "MORE", or
          # revision feedback).
          inbox_path = "automation/inbox.json"
          try:
              with open(inbox_path) as f:
                  inbox = json.load(f)
          except FileNotFoundError:
              inbox = []
          inbox.append({"text": text})
          with open(inbox_path, "w") as f:
              json.dump(inbox, f, indent=2)
              f.write("\n")
          subprocess.run(["git", "config", "user.email", "actions@github.com"], check=True)
          subprocess.run(["git", "config", "user.name", "github-actions"], check=True)
          subprocess.run(["git", "add", inbox_path], check=True)
          subprocess.run(["git", "commit", "-m", "Relay Telegram message to inbox"], check=True)
          # main may have moved (the weekly-issue routine commits here too) --
          # rebase before pushing rather than assume a clean fast-forward.
          subprocess.run(["git", "pull", "--rebase", "origin", "main"], check=True)
          subprocess.run(["git", "push"], check=True)
          PYEOF
