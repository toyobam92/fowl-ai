name: publish-nudge-nova

# Two hours before the daily auto-publish window (23:30 UTC), check whether
# today's Nova episode is actually ready to go out -- and say something if
# it isn't.
#
# Why this exists: on 2026-08-21 the "APPROVE 29" reply landed ~3 hours
# after the publish cron had already run. The video rendered fine, but its
# window was gone, so it silently slipped to the next evening with nothing
# anywhere announcing it. A nudge at 21:30 UTC turns that class of miss
# into a two-hour heads-up while there's still time to approve.
#
# Quiet by design: only notifies when something needs attention. On off
# days, and on days where the episode is already rendered and queued, this
# posts nothing at all.
#
# It also speaks up when the pipeline is parked on a slot that already
# passed (RESULT:stale). From 2026-10-06 the 2026-10-07 topic list sat
# unpicked in nova-pipeline-state.json; nova-daily-prep exits quietly in
# that state, so no new topics were proposed and no episode shipped after
# 2026-10-05 -- and this check said nothing, because the slot wasn't
# "today". Same invisible-freeze class as PR #69 in September.

on:
  schedule:
    - cron: '30 21 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  nudge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check whether today's episode is ready
        id: check
        run: |
          set -euo pipefail
          set +e
          OUTPUT=$(python3 automation/check_publish_readiness.py)
          echo "$OUTPUT"
          set -e
          RESULT_LINE=$(echo "$OUTPUT" | grep '^RESULT:' | tail -n1)
          echo "kind=$(echo "$RESULT_LINE" | cut -d: -f2)" >> "$GITHUB_OUTPUT"
          echo "detail=$(echo "$RESULT_LINE" | cut -d: -f3-)" >> "$GITHUB_OUTPUT"

      - name: Nudge on Telegram if anything needs attention
        if: steps.check.outputs.kind != 'ready' && steps.check.outputs.kind != 'none'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          KIND: ${{ steps.check.outputs.kind }}
          DETAIL: ${{ steps.check.outputs.detail }}
        run: |
          set -euo pipefail
          case "$KIND" in
            needs_approval)
              MSG="⏳ Today's Nova video still needs your APPROVE — reply \"APPROVE ${DETAIL}\" within the next ~2 hours or it misses tonight's 7:30pm ET window and slips to tomorrow."
              ;;
            rendering)
              MSG="⏳ Today's Nova video is approved but still rendering (video ${DETAIL}) with ~2 hours to the 7:30pm ET window. Renders normally finish in a few minutes, so this one may be stuck — worth a look."
              ;;
            needs_pick)
              MSG="⏳ Today's Nova episode (${DETAIL}) still has no topic picked, so there's nothing to post tonight. Reply \"NOVA 1/2/3\" if you want it to go out."
              ;;
            overdue)
              # Only emitted for posts post_to_meta will actually ship
              # tonight (not dropped, within MAX_DAYS_LATE) -- anything it
              # holds back gets auto-publish-nova.yml's own "⏸️ Held back"
              # notice instead, so this never claims a post that won't go.
              MSG="📌 Heads up: ${DETAIL} never posted on its own day and is still queued. It'll go out in tonight's 7:30pm ET window unless you say otherwise."
              ;;
            stale)
              MSG="⚠️ Nova's pipeline is parked and nothing newer will be proposed until it clears: ${DETAIL}."
              ;;
            *)
              MSG="⚠️ Nova publish readiness check returned an unexpected state (${KIND}: ${DETAIL})."
              ;;
          esac
          curl -s "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" --data-urlencode "text=${MSG}" > /dev/null
