name: schedule-watchdog

# Runs every 6 hours, any day: if an issue merged recently but nothing is
# scheduled in EmailOctopus yet, nudge the owner on Telegram to open Claude
# Code and ask to schedule it (that step can't run headless -- see
# send-issue.yml/the project memory on EmailOctopus's Cloudflare
# bot-protection). Replaces the old once-a-week "sunday-reminder" version,
# which only checked one fixed slot (5pm ET Sunday) -- a merge that lands
# any other time (e.g. Saturday night, as Issue 12's did) could sit
# unscheduled for the better part of a week before anyone was told. Checking
# 4x/day catches it same-day instead, without needing the owner to notice on
# their own.

on:
  schedule:
    - cron: '13 */6 * * *' # every 6 hours, any day; odd minute avoids the top-of-hour GH Actions pile-up
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check EmailOctopus + recent merges, nudge if needed
        env:
          EMAILOCTOPUS_API_KEY: ${{ secrets.EMAILOCTOPUS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 - <<'PYEOF'
          import datetime, json, os, subprocess, urllib.parse, urllib.request

          api_key = os.environ["EMAILOCTOPUS_API_KEY"]
          bot = os.environ["TELEGRAM_BOT_TOKEN"]
          chat_id = os.environ["TELEGRAM_CHAT_ID"]

          def notify(text):
              body = urllib.parse.urlencode({"chat_id": chat_id, "text": text}).encode()
              urllib.request.urlopen(f"https://api.telegram.org/bot{bot}/sendMessage", data=body).read()

          def next_monday_iso():
              # Matches telegram-approve.yml's SCHEDULE handler exactly, so the
              # date named in this nudge is always the same one that command
              # would actually compute.
              today = datetime.date.today()
              days_ahead = (7 - today.weekday()) % 7  # Monday == 0; today counts if it IS Monday
              return (today + datetime.timedelta(days=days_ahead)).isoformat()

          # EmailOctopus's Cloudflare WAF blocks the default "Python-urllib/x.y"
          # User-Agent outright (confirmed: plain curl with the same key
          # succeeds, urllib's default UA gets a 403) -- not an IP block, just
          # a default-library-UA rule. A normal client identifier is enough;
          # this is a legitimate authorized call with a valid API key, not an
          # attempt to evade anything meant to gate human/browser access.
          req = urllib.request.Request(
              "https://api.emailoctopus.com/campaigns",
              headers={
                  "Authorization": f"Bearer {api_key}",
                  "User-Agent": "fowlai-schedule-watchdog/1.0",
              },
          )
          with urllib.request.urlopen(req) as r:
              campaigns = json.load(r).get("data", [])

          # EmailOctopus's real status value for an armed-but-unsent campaign
          # is "preparing", not "scheduled" -- confirmed against the live
          # account (Issue 11's campaign, scheduled 2026-08-02, shows this).
          # "sending" covers the brief in-flight window at send time.
          if any(c.get("status") in ("preparing", "sending") for c in campaigns):
              print("Already scheduled -- no reminder needed.")
              raise SystemExit(0)

          view = subprocess.run(
              ["gh", "pr", "list", "-R", "toyobam92/fowl-ai", "--state", "merged",
               "--json", "headRefName,mergedAt,number,title", "--limit", "20"],
              capture_output=True, text=True, check=True,
          )
          merged = json.loads(view.stdout)
          cutoff = datetime.datetime.now(datetime.timezone.utc) - datetime.timedelta(days=8)
          recent_issue_prs = [
              pr for pr in merged
              if pr.get("headRefName", "").startswith("draft/issue-")
              and datetime.datetime.fromisoformat(pr["mergedAt"].replace("Z", "+00:00")) >= cutoff
          ]

          if not recent_issue_prs:
              print("No issue merged in the last 8 days -- nothing to schedule yet.")
              raise SystemExit(0)

          latest = max(recent_issue_prs, key=lambda pr: pr["mergedAt"])
          merged_at = datetime.datetime.fromisoformat(
              latest["mergedAt"].replace("Z", "+00:00")
          )

          # A campaign that already SENT since (roughly) this issue merged means
          # the issue was scheduled and has gone out -- the "preparing" check
          # above can't see that, because EmailOctopus flips the status to
          # "sent" the moment the blast completes, which restarted the nagging
          # for the rest of the merge's 8-day window (bitten by Issue 12: sent
          # Monday morning, nagged every 6h afterwards). 24h of slack covers a
          # campaign that was built shortly before its PR merged.
          def campaign_time(c):
              for key in ("sent_at", "created_at"):
                  raw = c.get(key)
                  if isinstance(raw, str):
                      try:
                          t = datetime.datetime.fromisoformat(raw.replace("Z", "+00:00"))
                      except ValueError:
                          continue
                      if t.tzinfo is None:
                          t = t.replace(tzinfo=datetime.timezone.utc)
                      return t
              return None

          slack = merged_at - datetime.timedelta(hours=24)
          for c in campaigns:
              t = campaign_time(c)
              if c.get("status") == "sent" and t and t >= slack:
                  print(f"Campaign already sent at {t.isoformat()} -- no reminder needed.")
                  raise SystemExit(0)

          notify(
              f"⏰ Still unscheduled: \"{latest['title']}\" (PR #{latest['number']}) is live "
              f"but nothing's scheduled in EmailOctopus yet. Open Claude Code and ask me to "
              f"schedule it for {next_monday_iso()} 7:45am ET."
          )
          PYEOF
