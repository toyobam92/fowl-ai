name: pr-notify

# Notifies on every opened/reopened PR, full stop -- no branch-name allowlist.
# Previously gated on startsWith(head_ref, 'draft/') || startsWith(head_ref,
# 'update/'), which silently dropped the notification for PR #8 (branch
# add/signup-sync-automation) -- neither prefix matched, so the job was
# skipped with no error, and the owner never got the Telegram ping to
# approve it. Every PR in this repo already goes through this Telegram
# gate by convention; an allowlist of prefixes was solving a problem that
# doesn't exist while creating a silent-failure mode for any prefix nobody
# thought to add ahead of time.

on:
  pull_request:
    types: [opened, reopened]

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Notify Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          STAT=$(git diff --stat "$BASE_SHA" "$HEAD_SHA" | tail -n 25)
          MSG=$(printf '🐔 New PR #%s: %s\n%s\n\nFiles changed:\n%s\n\nReply "APPROVE %s" here to merge & deploy.' \
            "$PR_NUMBER" "$PR_TITLE" "$PR_URL" "$STAT" "$PR_NUMBER")
          curl -s "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MSG}" > /dev/null
