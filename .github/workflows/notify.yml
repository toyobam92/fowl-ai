name: notify

# Sends one Telegram message. Exists so the weekly-issue cloud routine (which
# has no access to repo secrets -- only GitHub Actions does) can notify the
# user without ever being handed the bot token itself: it calls
# `gh workflow run notify.yml -f text="..."` instead of curling Telegram
# directly with a token it doesn't actually have.

on:
  workflow_dispatch:
    inputs:
      text:
        description: 'Message text to send'
        required: true

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Send Telegram message
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Passed via env, never spliced directly into the script -- `${{ }}`
          # substitutes literal text into the run block before bash sees it,
          # so anything like a literal "$80" in the message becomes a real
          # shell variable reference ($8) and blows up under `set -u`.
          MESSAGE_TEXT: ${{ github.event.inputs.text }}
        run: |
          set -euo pipefail
          curl -s "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MESSAGE_TEXT}" > /dev/null
