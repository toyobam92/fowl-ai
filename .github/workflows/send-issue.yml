name: send-issue

# Drives EmailOctopus's UI with Playwright to build a campaign draft (there is no
# public create/send API -- confirmed 2026-08-02 against the real account). Stops
# once the draft is saved; a human still reviews and presses Send in EmailOctopus.
# Needs EMAILOCTOPUS_EMAIL / EMAILOCTOPUS_PASSWORD as repo secrets.

on:
  workflow_dispatch:
    inputs:
      issue_path:
        description: 'Path to the merged issue HTML, e.g. issues/2026-08-03/index.html'
        required: true
      subject:
        description: 'Email subject line'
        required: true

permissions:
  contents: read

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm install --no-save playwright@^1.47.0
          npx playwright install --with-deps chromium

      - name: Create EmailOctopus draft
        id: draft
        env:
          EMAILOCTOPUS_EMAIL: ${{ secrets.EMAILOCTOPUS_EMAIL }}
          EMAILOCTOPUS_PASSWORD: ${{ secrets.EMAILOCTOPUS_PASSWORD }}
          ISSUE_PATH: ${{ github.event.inputs.issue_path }}
          SUBJECT: ${{ github.event.inputs.subject }}
        run: node automation/emailoctopus-draft.mjs

      - name: Notify success
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SUBJECT: ${{ github.event.inputs.subject }}
        run: |
          set -euo pipefail
          MSG=$(printf '📧 Draft ready in EmailOctopus: %s\n\nOpen https://emailoctopus.com/campaigns (Draft tab), review, and press Send.' "$SUBJECT")
          curl -s "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MSG}" > /dev/null

      - name: Notify failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SUBJECT: ${{ github.event.inputs.subject }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          MSG=$(printf '\xE2\x9D\x8C Could not auto-draft in EmailOctopus: %s\n%s\n\nPaste the HTML in manually this time -- see the run log for what broke.' "$SUBJECT" "$RUN_URL")
          curl -s "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MSG}" > /dev/null
