name: token-expiry-reminder

# The Cloudflare worker fowlai-telegram-hook authenticates to GitHub with a
# fine-grained PAT (GH_TOKEN). The current one was created 2026-09-22 and
# EXPIRES 2026-10-22. When it dies, every Telegram reply is silently dropped
# (happened Sep 14-22 2026). This nudges Telegram one week before, two days
# before, and on the day. Rotation recipe: create a new PAT (repo fowl-ai
# only, Actions: read+write), then
#   npx wrangler secret put GH_TOKEN --name fowlai-telegram-hook
# and update the dates below.

on:
  schedule:
    - cron: '17 13 15 10 *'  # Oct 15, ~9:17am ET
    - cron: '17 13 20 10 *'  # Oct 20
    - cron: '17 13 22 10 *'  # Oct 22 (expiry day)
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  nudge:
    runs-on: ubuntu-latest
    steps:
      - name: Send Telegram reminder
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          TEXT="🔑 The GitHub token inside the Telegram relay worker expires Oct 22 2026. Open Claude Code and ask to rotate the relay token (new fine-grained PAT, Actions read+write on fowl-ai, then wrangler secret put GH_TOKEN). If it lapses, your Telegram replies stop reaching GitHub silently."
          curl -s -o /dev/null -w "telegram %{http_code}\n" -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" --data-urlencode "text=${TEXT}"
