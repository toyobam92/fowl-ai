# Auto-Apply System Config
mode: approve_required   # approve_required | full_auto (per-adapter, Phase 5)
daily_submit_cap: 5
kill_switch: false

model: claude-sonnet-4-6

search_filters:
  keywords_any:
    - credit risk analytics
    - risk modeling
    - fraud analytics
    - machine learning
    - AI/ML
    - predictive analytics
    - decision science
    - model risk
  titles_any:
    - Senior Data Scientist
    - Staff Data Scientist
    - Senior Manager Analytics
    - Senior Risk Analyst
    - ML Engineer
    - Senior Statistical Modeler
  industries: [fintech, banking, lending, payments, credit bureaus, insurtech]
  location: remote_us
  seniority: [senior, staff, manager]
  exclude:
    - onsite-only
    - clearance required

# Form-fill identity — adapters fill these deterministically, never via LLM.
applicant:
  first_name: Toyosi
  last_name: Bamidele
  email: toyosibamidele@gmail.com
  phone: "404-971-8544"
  location: Atlanta, GA
  current_company: Visa
  website: https://toyosibamidele.com
  linkedin: ""   # add profile URL

# Seed answers for screening questions (non-sensitive only — this repo is public).
# Loaded into the answers_bank table on each adapter run; add sensitive answers
# (salary, EEO) locally via: python -m apply.answers add "<question>" "<answer>"
screening_answers:
  "are you legally authorized to work in the united states": "Yes"
  "are you authorized to work in the us": "Yes"
  "will you now or in the future require sponsorship": "No"
  "do you now or will you in the future require sponsorship for employment visa status": "No"
  "do you require visa sponsorship": "No"
  "are you willing to relocate": "No — seeking remote roles; based in Atlanta, GA"
  "have you ever worked for this company before": "No"
  "how did you hear about this job": "Company careers page"

score_thresholds:
  auto_prep: 80        # >= this: generate assets automatically
  digest: 60           # 60-79: weekly manual review digest
  full_auto_min: 90    # full-auto submit only above this (after adapter proven)

guardrails:
  max_jd_keywords_inserted: 8   # keyword density cap
  audit_required: true          # audit failure blocks pipeline, no exceptions

# ATS board tokens polled by `python -m scrapers.run` (Phase 2).
# UNVERIFIED seeds — confirm each with `python -m scrapers.probe <company>` from a
# machine with normal network access; probe prints ready-to-paste lines. Companies
# with no board on these three ATSes (Workday/Taleo/custom) stay manual-queue.
boards:
  greenhouse:
    - sofi
    - affirm
    - upstart
  lever: []
  ashby:
    - ramp

company_watchlist:
  - Prosper
  - LexisNexis Risk Solutions
  - Upstart
  - SoFi
  - Affirm
  - Chime
  - Block
  - Capital One
  - Discover
  - Synchrony
  - TransUnion
  - Experian
  - Equifax
  - Marqeta
  - Plaid
  - Ramp
  - Brex
  - Stripe
